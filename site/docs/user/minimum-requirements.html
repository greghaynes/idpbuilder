<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Minimum Requirements - IDP Builder Documentation">
    <title>Minimum Requirements | IDP Builder</title>
    <link rel="stylesheet" href="../../css/style.css">
    <script type="module">
        import mermaid from 'https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.esm.min.mjs';
        mermaid.initialize({ 
            startOnLoad: true,
            theme: 'default',
            securityLevel: 'loose'
        });
    </script>
    <style>
        .docs-container {
            max-width: 900px;
            margin: 2rem auto;
            padding: 0 1rem;
        }
        .breadcrumb {
            font-size: 0.9rem;
            color: var(--text-muted);
            margin-bottom: 1rem;
        }
        .breadcrumb a {
            color: var(--primary-color);
            text-decoration: none;
        }
        .breadcrumb a:hover {
            text-decoration: underline;
        }
        .markdown-content {
            line-height: 1.6;
        }
        .markdown-content h1 {
            border-bottom: 2px solid var(--border-color);
            padding-bottom: 0.5rem;
            margin-bottom: 1.5rem;
        }
        .markdown-content h2 {
            margin-top: 2rem;
            margin-bottom: 1rem;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 0.3rem;
        }
        .markdown-content h3 {
            margin-top: 1.5rem;
            margin-bottom: 0.75rem;
        }
        .markdown-content pre {
            background-color: var(--bg-alt);
            padding: 1rem;
            border-radius: 5px;
            overflow-x: auto;
        }
        .markdown-content code {
            background-color: var(--bg-alt);
            padding: 0.2rem 0.4rem;
            border-radius: 3px;
            font-family: 'Courier New', monospace;
            font-size: 0.9em;
        }
        .markdown-content pre code {
            background-color: transparent;
            padding: 0;
        }
        .markdown-content blockquote {
            border-left: 4px solid var(--primary-color);
            padding-left: 1rem;
            margin-left: 0;
            color: var(--text-muted);
        }
        .markdown-content table {
            border-collapse: collapse;
            width: 100%;
            margin: 1rem 0;
        }
        .markdown-content th,
        .markdown-content td {
            border: 1px solid var(--border-color);
            padding: 0.5rem;
            text-align: left;
        }
        .markdown-content th {
            background-color: var(--bg-alt);
            font-weight: bold;
        }
        .markdown-content a {
            color: var(--primary-color);
            text-decoration: none;
        }
        .markdown-content a:hover {
            text-decoration: underline;
        }
        .markdown-content img {
            max-width: 100%;
            height: auto;
        }
        .markdown-content ul,
        .markdown-content ol {
            padding-left: 2rem;
            margin: 1rem 0;
        }
        .markdown-content li {
            margin: 0.5rem 0;
        }
        /* Mermaid diagram styling */
        .markdown-content .mermaid {
            background-color: transparent;
            padding: 1rem;
            margin: 1.5rem 0;
            text-align: center;
            overflow-x: auto;
        }
        .markdown-content pre.mermaid {
            background-color: var(--bg-alt);
            border-radius: 5px;
        }
    </style>
</head>
<body>
    <header>
        <nav class="container">
            <div class="logo">
                <h1>IDP Builder</h1>
            </div>
            <button class="menu-toggle" aria-label="Toggle menu" onclick="toggleMenu()">
                ☰
            </button>
            <ul class="nav-links" id="navLinks">
                <li><a href="../../index.html">Home</a></li>
                <li><a href="../index.html">Docs</a></li>
                <li><a href="https://github.com/cnoe-io/idpbuilder" target="_blank" rel="noopener">GitHub</a></li>
            </ul>
        </nav>
    </header>

    <main class="container">
        <div class="docs-container">
            <div class="breadcrumb">
                <a href="../../index.html">Home</a> / 
                <a href="../index.html">Docs</a> / <a href="../index.html">User Guides</a>
            </div>
            <article class="markdown-content">
                <h1>Minimum Requirements</h1>
<p>The requirements for your cluster will depend on what it is running but we
recommend a minimum of 4 CPU cores and 4GiB of RAM.</p>

            </article>
        </div>
    </main>

    <footer>
        <div class="container">
            <p>&copy; 2024 CNOE IDP Builder. Licensed under <a href="https://github.com/cnoe-io/idpbuilder/blob/main/LICENSE" target="_blank" rel="noopener">Apache License 2.0</a></p>
        </div>
    </footer>

    <script>
        function toggleMenu() {
            const navLinks = document.getElementById('navLinks');
            navLinks.classList.toggle('active');
        }

        document.addEventListener('click', function(event) {
            const nav = document.querySelector('nav');
            const navLinks = document.getElementById('navLinks');
            
            if (!nav.contains(event.target)) {
                navLinks.classList.remove('active');
            }
        });
    </script>
</body>
</html>
